# Builds the Windows installer and makes a DRAFT GitHub release for it. Nothing is published:
# the draft (and its tag, which GitHub creates only when the draft is published) waits on the
# Releases page until someone reviews it and presses "Publish release".
#
# Before running it: set the version (node scripts/set-version.mjs X.Y.Z), give CHANGELOG.md and
# CHANGELOG_TR.md a "## X.Y.Z" section, commit and push. Then: Actions › Draft release › Run
# workflow, with the same X.Y.Z.
name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, three numbers (e.g. 0.9.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      # tauri.conf.json bundles the helper from here.
      CARGO_TARGET_DIR: ${{ github.workspace }}\.artifacts\cargo-target
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the version and its changelog
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "The version is three numbers, like 0.9.0 (not '$env:VERSION')." }
          $found = (node scripts/set-version.mjs | Select-Object -Last 1)
          if ($LASTEXITCODE) { throw 'The version differs between files; run node scripts/set-version.mjs.' }
          if ($found -ne "AgentOffice $env:VERSION") { throw "The code says '$found', not AgentOffice $env:VERSION. Run node scripts/set-version.mjs $env:VERSION and push first." }
          node scripts/release-notes.mjs $env:VERSION > $null
          if ($LASTEXITCODE) { throw 'CHANGELOG.md or CHANGELOG_TR.md has no section for this version.' }
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release v$env:VERSION already exists (published or draft)." }
          $global:LASTEXITCODE = 0

      - name: Install
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { throw 'Rust tests failed' }

      - name: Build the installer
        working-directory: app
        run: |
          cargo build --release --manifest-path hook/Cargo.toml
          if ($LASTEXITCODE) { throw 'helper build failed' }
          npm run tauri -- build --bundles nsis --features custom-protocol
          if ($LASTEXITCODE) { throw 'installer build failed' }

      - name: Create the draft release
        run: |
          $installer = Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'No installer was built.' }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($installer.Name)" | Set-Content -NoNewline -Encoding ascii "$($installer.FullName).sha256"
          node scripts/release-notes.mjs $env:VERSION $installer.Name $sha | Set-Content -Encoding utf8 notes.md
          gh release create "v$env:VERSION" $installer.FullName "$($installer.FullName).sha256" --draft --target $env:GITHUB_SHA --title "The Agent Office $env:VERSION" --notes-file notes.md
          if ($LASTEXITCODE) { throw 'Could not create the draft release.' }
          "Draft release v$env:VERSION created with $($installer.Name). Review it on the Releases page; nothing is published yet."
