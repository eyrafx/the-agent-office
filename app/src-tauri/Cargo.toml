[package]
name = "agentoffice"
version = "0.1.0"
description = "AgentOffice desktop office and companion notch"
edition = "2021"
rust-version = "1.85"
default-run = "agentoffice"

[lib]
name = "agentoffice_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
# Reads (only) the Codex app's own list of projects and threads.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Foundation", "Foundation_Collections", "Media", "Media_Control", "Storage", "Storage_Streams", "Graphics_Imaging", "Web_Http", "Web_Http_Headers", "Web_Http_Filters", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Power", "Win32_System_Registry", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Networking_Connectivity", "ApplicationModel", "ApplicationModel_Activation", "Win32_Storage_Packaging_Appx"] }
# Waiting on WinRT calls (media sessions) with a time limit.
windows-future = "0.3"
webview2-com = "0.39.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_System_Time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
