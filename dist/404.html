<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080b">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>AgentOffice — Page not found</title>
<style>
  /* Self-contained: GitHub Pages shows this page at any depth, so it relies on no relative files. */
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#07080b;color:#f4f1ec;font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0%,#a65a1940,transparent 60%),radial-gradient(ellipse at 15% 90%,#44224440,transparent 55%),#07080b}
  .island{position:fixed;top:0;left:50%;transform:translateX(-50%);width:196px;height:32px;border-radius:0 0 16px 16px;background:linear-gradient(180deg,#15171d,#050607);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:#ffc17d;box-shadow:0 10px 30px -10px #000}
  .island i{width:7px;height:7px;border-radius:50%;background:#ffad62;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}
  main{max-width:560px;text-align:center}
  .code{font-size:13px;letter-spacing:2px;color:#ffb76b;margin:0 0 14px}
  h1{font-size:clamp(34px,7vw,56px);line-height:1.05;letter-spacing:-1.8px;margin:0 0 16px}
  p{font-size:17px;line-height:1.7;color:#b9b5ae;margin:0 0 30px}
  a{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:12px 26px;border-radius:40px;font-weight:650;font-size:16px;text-decoration:none;color:#271909;background:linear-gradient(180deg,#ffb86d,#ff9b38);border:1px solid #ffd19a;box-shadow:inset 0 2px 0 #ffffff55,0 16px 45px -22px #ff9b38aa}
  a:focus-visible{outline:2px solid #ffc17d;outline-offset:4px}
  @media(prefers-reduced-motion:reduce){.island i{animation:none}}
</style>
</head>
<body>
<div class="island" aria-hidden="true"><i></i>404</div>
<main>
  <p class="code">404</p>
  <h1 id="t">This page went for a coffee.</h1>
  <p id="d">The link may be old or mistyped. The island and the office are waiting on the home page.</p>
  <a id="home" href="/">Back to AgentOffice</a>
</main>
<script>
  (function () {
    // The site's home: /agentoffice/ on GitHub Pages, else the server root.
    var base = /^\/agentoffice(\/|$)/i.test(location.pathname) ? '/agentoffice/' : '/';
    var copy = {
      en: ['This page went for a coffee.', 'The link may be old or mistyped. The island and the office are waiting on the home page.', 'Back to AgentOffice', 'Page not found'],
      tr: ['Bu sayfa kahve molasında.', 'Bağlantı eski ya da hatalı olabilir. Ada ve ofis ana sayfada seni bekliyor.', 'AgentOffice’e dön', 'Sayfa bulunamadı'],
      es: ['Esta página salió a por un café.', 'El enlace puede ser antiguo o estar mal escrito. La isla y la oficina te esperan en la página de inicio.', 'Volver a AgentOffice', 'Página no encontrada'],
      de: ['Diese Seite macht Kaffeepause.', 'Der Link ist vielleicht alt oder falsch geschrieben. Insel und Büro warten auf der Startseite.', 'Zurück zu AgentOffice', 'Seite nicht gefunden'],
      fr: ['Cette page est partie prendre un café.', 'Le lien est peut-être ancien ou mal saisi. L’île et le bureau vous attendent sur la page d’accueil.', 'Retour à AgentOffice', 'Page introuvable'],
      'pt-BR': ['Esta página foi tomar um café.', 'O link pode estar antigo ou incorreto. A ilha e o escritório esperam por você na página inicial.', 'Voltar ao AgentOffice', 'Página não encontrada'],
      it: ['Questa pagina è andata a prendere un caffè.', 'Il link potrebbe essere vecchio o sbagliato. L’isola e l’ufficio ti aspettano nella pagina iniziale.', 'Torna ad AgentOffice', 'Pagina non trovata'],
      ru: ['Эта страница ушла на кофе.', 'Ссылка могла устареть или содержать ошибку. Остров и офис ждут на главной странице.', 'Вернуться в AgentOffice', 'Страница не найдена'],
      ja: ['このページはコーヒー休憩中です。', 'リンクが古いか、入力が間違っている可能性があります。アイランドとオフィスはホームページで待っています。', 'AgentOffice に戻る', 'ページが見つかりません'],
      ko: ['이 페이지는 커피 마시러 갔어요.', '링크가 오래되었거나 잘못 입력되었을 수 있습니다. 아일랜드와 오피스가 홈페이지에서 기다립니다.', 'AgentOffice로 돌아가기', '페이지를 찾을 수 없음'],
      'zh-Hans': ['这个页面去喝咖啡了。', '链接可能已过期或输入有误。小岛和办公室正在首页等你。', '返回 AgentOffice', '找不到页面']
    };
    var tags = { en: 'en-US', tr: 'tr-TR', es: 'es-ES', de: 'de-DE', fr: 'fr-FR', 'pt-BR': 'pt-BR', it: 'it-IT', ru: 'ru-RU', ja: 'ja-JP', ko: 'ko-KR', 'zh-Hans': 'zh-CN' };
    var lang = null;
    try { lang = localStorage.getItem('agentoffice:site-language'); } catch (e) {}
    if (!copy[lang]) {
      var nav = (navigator.languages || [navigator.language || 'en']).map(function (x) { return String(x).toLowerCase(); });
      lang = 'en';
      for (var i = 0; i < nav.length; i++) {
        var l = nav[i];
        if (l.indexOf('pt') === 0) { lang = 'pt-BR'; break; }
        if (l.indexOf('zh') === 0) { lang = 'zh-Hans'; break; }
        if (copy[l.split('-')[0]]) { lang = l.split('-')[0]; break; }
      }
    }
    var c = copy[lang];
    document.documentElement.lang = tags[lang];
    document.getElementById('t').textContent = c[0];
    document.getElementById('d').textContent = c[1];
    var home = document.getElementById('home');
    home.textContent = c[2];
    home.href = base + (lang !== 'en' ? '?lang=' + encodeURIComponent(lang) : '');
    document.title = 'AgentOffice — ' + c[3];
  })();
</script>
</body>
</html>
